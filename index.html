<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Тень над Ростовом</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Special+Elite&family=Oswald:wght@400;700&display=swap');

        body {
            margin: 0;
            padding: 0;
            background-color: #000;
            overflow: hidden;
            font-family: 'Special Elite', cursive;
            color: #ddd;
            user-select: none;
        }

        /* --- ОБЩИЕ ЭЛЕМЕНТЫ --- */
        .screen {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            opacity: 0;
            transition: opacity 0.8s ease-in-out;
            pointer-events: none;
            z-index: 1;
        }
        .screen.active {
            opacity: 1;
            pointer-events: all;
            z-index: 10;
        }

        /* --- ЗАСТАВКА --- */
        #splash {
            background: radial-gradient(circle at center, #1a1a1a, #000);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 100;
        }
        #splash h1 {
            font-family: 'Oswald', sans-serif;
            font-size: 70px;
            color: #8b0000;
            text-transform: uppercase;
            letter-spacing: 10px;
            text-shadow: 0 0 20px rgba(139, 0, 0, 0.8);
            margin: 0;
        }
        #splash h2 {
            font-size: 20px;
            color: #666;
            letter-spacing: 5px;
            margin-top: 10px;
            margin-bottom: 50px;
        }
        #start-btn {
            padding: 15px 50px;
            font-size: 20px;
            background: transparent;
            color: #fff;
            border: 2px solid #8b0000;
            cursor: pointer;
            font-family: 'Oswald', sans-serif;
            text-transform: uppercase;
            letter-spacing: 2px;
            transition: 0.3s;
        }
        #start-btn:hover {
            background: #8b0000;
            box-shadow: 0 0 30px rgba(139, 0, 0, 0.7);
        }

        /* --- КАРТА --- */
        #map-screen {
            background: #1a1a1a;
        }
        #map-bg {
            position: absolute;
            width: 100%; height: 100%;
            background-image: url('https://images.unsplash.com/photo-1524661135-423995f22d0b?ixlib=rb-4.0.3&auto=format&fit=crop&w=1920&q=80');
            background-size: cover;
            background-position: center;
            filter: grayscale(100%) contrast(200%) brightness(40%) sepia(50%) hue-rotate(180deg);
            z-index: 1;
        }
        .location-node {
            position: absolute;
            width: 60px; height: 60px;
            background: rgba(255, 255, 255, 0.1);
            border: 2px solid #8b0000;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            z-index: 10;
            transition: 0.3s;
            box-shadow: 0 0 15px rgba(139, 0, 0, 0.5);
        }
        .location-node:hover {
            transform: scale(1.2);
            background: rgba(139, 0, 0, 0.5);
            box-shadow: 0 0 30px #8b0000;
        }
        .location-node span {
            font-family: 'Oswald', sans-serif;
            font-size: 12px;
            text-align: center;
            color: #fff;
            pointer-events: none;
            text-shadow: 1px 1px 2px #000;
        }
        /* Координаты локаций на карте */
        #loc-office { top: 30%; left: 20%; }
        #loc-crime { top: 60%; left: 50%; }
        #loc-warehouse { top: 20%; left: 70%; }
        #loc-bar { top: 70%; left: 80%; }

        /* --- ЛОКАЦИЯ (Игровой экран) --- */
        #game-screen {
            background: #000;
        }
        #game-bg {
            position: absolute;
            width: 100%; height: 100%;
            background-size: cover;
            background-position: center;
            filter: grayscale(80%) contrast(150%) brightness(50%);
            transition: background-image 1s ease;
            z-index: 1;
        }
        /* Виньетка */
        #game-screen::after {
            content: '';
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            box-shadow: inset 0 0 200px rgba(0,0,0,0.9);
            pointer-events: none;
            z-index: 2;
        }

        /* Кнопка "Назад на карту" */
        #back-to-map {
            position: absolute;
            top: 20px;
            left: 20px;
            z-index: 20;
            background: rgba(0,0,0,0.8);
            color: #fff;
            border: 1px solid #555;
            padding: 10px 20px;
            cursor: pointer;
            font-family: 'Oswald', sans-serif;
            transition: 0.3s;
        }
        #back-to-map:hover { border-color: #8b0000; color: #8b0000; }

        /* Блокнот с уликами */
        #notebook {
            position: absolute;
            top: 20px;
            right: 20px;
            width: 250px;
            background: rgba(10, 10, 10, 0.9);
            border: 1px solid #333;
            border-top: 3px solid #8b0000;
            padding: 15px;
            z-index: 20;
            font-family: 'Oswald', sans-serif;
        }
        #notebook h3 {
            margin: 0 0 10px 0;
            font-size: 16px;
            color: #8b0000;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .evidence-item {
            font-family: 'Special Elite', cursive;
            font-size: 13px;
            color: #666;
            margin-bottom: 8px;
            padding-left: 15px;
            position: relative;
            transition: color 0.5s;
        }
        .evidence-item::before {
            content: '✖';
            position: absolute;
            left: 0;
            font-size: 10px;
        }
        .evidence-item.found {
            color: #ddd;
        }
        .evidence-item.found::before {
            content: '✔';
            color: #8b0000;
        }

        /* Диалоговое окно */
        #dialogue-container {
            position: absolute;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%);
            width: 80%;
            max-width: 1000px;
            background: rgba(5, 5, 5, 0.95);
            border: 1px solid #333;
            padding: 30px;
            z-index: 20;
            box-shadow: 0 -10px 40px rgba(0,0,0,0.8);
            display: none; /* Скрыто, пока нет диалога */
        }
        #speaker {
            position: absolute;
            top: -18px;
            left: 30px;
            background: #8b0000;
            color: #fff;
            padding: 5px 20px;
            font-family: 'Oswald', sans-serif;
            font-size: 16px;
            text-transform: uppercase;
            letter-spacing: 2px;
        }
        #text {
            font-size: 22px;
            line-height: 1.5;
            margin: 0;
            min-height: 80px;
        }
        #choices {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-top: 20px;
        }
        .choice {
            background: transparent;
            border: 1px solid #444;
            color: #aaa;
            padding: 15px;
            text-align: left;
            font-family: 'Special Elite', cursive;
            font-size: 18px;
            cursor: pointer;
            transition: 0.2s;
        }
        .choice:hover {
            background: rgba(139, 0, 0, 0.2);
            border-color: #8b0000;
            color: #fff;
            padding-left: 25px;
        }

        /* Кнопка Далее */
        #next-btn {
            position: absolute;
            bottom: 20px;
            right: 30px;
            background: transparent;
            border: none;
            color: #8b0000;
            font-size: 40px;
            cursor: pointer;
            display: none;
            font-family: 'Oswald', sans-serif;
            transition: 0.3s;
        }
        #next-btn:hover { color: #ff3333; text-shadow: 0 0 10px #ff3333; }

        /* Финал */
        #game-over {
            background: #000;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 200;
            text-align: center;
        }
        #game-over h1 {
            font-family: 'Oswald', sans-serif;
            font-size: 70px;
            color: #8b0000;
            margin-bottom: 20px;
        }
        #game-over p {
            font-size: 24px;
            max-width: 800px;
            line-height: 1.6;
            margin-bottom: 50px;
        }

    </style>
</head>
<body>

    <!-- 1. ЗАСТАВКА -->
    <div id="splash" class="screen active">
        <h1>ТЕНЬ НАД РОСТОВОМ</h1>
        <h2>Интерактивное расследование</h2>
        <button id="start-btn" onclick="startGame()">НАЧАТЬ ДЕЛО</button>
    </div>

    <!-- 2. КАРТА -->
    <div id="map-screen" class="screen">
        <div id="map-bg"></div>
        <!-- Локации -->
        <div class="location-node" id="loc-office" onclick="travelTo('office')">
            <span>Прокуратура</span>
        </div>
        <div class="location-node" id="loc-crime" onclick="travelTo('crime')">
            <span>Место преступления</span>
        </div>
        <div class="location-node" id="loc-warehouse" onclick="travelTo('warehouse')">
            <span>Склад</span>
        </div>
        <div class="location-node" id="loc-bar" onclick="travelTo('bar')">
            <span>Бар "Тихий Дон"</span>
        </div>
    </div>

    <!-- 3. ИГРОВОЙ ЭКРАН -->
    <div id="game-screen" class="screen">
        <div id="game-bg"></div>
        
        <button id="back-to-map" onclick="goToMap()">← На карту</button>
        
        <!-- Блокнот -->
        <div id="notebook">
            <h3>Улики</h3>
            <div id="evidence-list">
                <div class="evidence-item" id="ev-note">Записка</div>
                <div class="evidence-item" id="ev-tire">Следы шин</div>
                <div class="evidence-item" id="ev-witness">Показания свидетеля</div>
                <div class="evidence-item" id="ev-key">Ключ от склада</div>
                <div class="evidence-item" id="ev-photo">Фото подозреваемого</div>
            </div>
        </div>

        <!-- Диалоговое окно -->
        <div id="dialogue-container">
            <div id="speaker">Следователь</div>
            <p id="text"></p>
            <div id="choices"></div>
            <button id="next-btn" onclick="nextDialogue()">▶</button>
        </div>
    </div>

    <!-- 4. ФИНАЛ -->
    <div id="game-over" class="screen">
        <h1 id="ending-title">КОНЕЦ</h1>
        <p id="ending-text"></p>
        <button class="choice" onclick="location.reload()" style="width: 200px; text-align: center;">Начать заново</button>
    </div>

    <script>
        // --- ЗВУКИ ---
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        let droneOsc;

        function startAmbience() {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            // Низкий гул
            droneOsc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            droneOsc.type = 'sine';
            droneOsc.frequency.value = 60;
            gain.gain.value = 0.05;
            droneOsc.connect(gain);
            gain.connect(audioCtx.destination);
            droneOsc.start();

            // Шум дождя
            const bufferSize = audioCtx.sampleRate * 2;
            const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
            const data = buffer.getChannelData(0);
            for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;
            const noise = audioCtx.createBufferSource();
            noise.buffer = buffer;
            noise.loop = true;
            const filter = audioCtx.createBiquadFilter();
            filter.type = 'lowpass';
            filter.frequency.value = 800;
            const noiseGain = audioCtx.createGain();
            noiseGain.gain.value = 0.02;
            noise.connect(filter);
            filter.connect(noiseGain);
            noiseGain.connect(audioCtx.destination);
            noise.start();
        }

        function playClick() {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'square';
            osc.frequency.setValueAtTime(200, audioCtx.currentTime);
            gain.gain.setValueAtTime(0.05, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.1);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.1);
        }

        // --- ДАННЫЕ ---
        const images = {
            office: "https://images.unsplash.com/photo-1505664194779-8beaceb93744?ixlib=rb-4.0.3&auto=format&fit=crop&w=1920&q=80",
            crime: "https://images.unsplash.com/photo-1584820927498-cddab6e8ad1e?ixlib=rb-4.0.3&auto=format&fit=crop&w=1920&q=80",
            warehouse: "https://images.unsplash.com/photo-1586528116311-ad8dd3c8310d?ixlib=rb-4.0.3&auto=format&fit=crop&w=1920&q=80",
            bar: "https://images.unsplash.com/photo-1514933651103-005eec06c04b?ixlib=rb-4.0.3&auto=format&fit=crop&w=1920&q=80",
            night: "https://images.unsplash.com/photo-1478760329108-5c3ed9d495a0?ixlib=rb-4.0.3&auto=format&fit=crop&w=1920&q=80"
        };

        let evidence = {
            note: false,
            tire: false,
            witness: false,
            key: false,
            photo: false
        };

        let visited = {
            office: false,
            crime: false,
            warehouse: false,
            bar: false
        };

        // Состояние текущего диалога
        let currentLocation = '';
        let currentDialogue = null;
        let dialogueIndex = 0;

        // --- СЦЕНАРИИ ЛОКАЦИЙ ---
        const scenarios = {
            office: [
                { speaker: "Начальник", text: "Следователь, у нас новое дело. Пропала девочка. Есть подозреваемый, но улик нет. Начинай с места преступления, потом загляни в бар, там часто ошиваются свидетели." },
                { speaker: "Следователь", text: "Понял. Выезжаю." }
            ],
            crime: [
                { speaker: "Эксперт", text: "Следы шин ведут к складу. А вот это нашли в кустах.", action: () => { evidence.tire = true; evidence.note = true; updateNotebook(); } },
                { speaker: "Следователь", text: "Записка... тут только обрывок фразы: '...тихий дон...'. Проверю склад." }
            ],
            warehouse: [
                { speaker: "Следователь", text: "Склад заброшен. Но дверь подсобки приоткрыта..." },
                { speaker: "Голос", text: "Кто здесь?!" },
                { choices: [
                    { text: "«Полиция! Стоять!»", next: 2, action: () => { evidence.photo = true; evidence.key = true; updateNotebook(); } },
                    { text: "Спрятаться в тени и наблюдать", next: 3 }
                ]}
            ],
            warehouse_choice_1: [
                { speaker: "Подозреваемый", text: "Вы ничего не докажете. У меня есть алиби." },
                { speaker: "Следователь", text: "Мы найдем доказательства. (Осматривая стол, находит фото и ключ)." }
            ],
            warehouse_choice_2: [
                { speaker: "Следователь", text: "Я вижу, как он прячет что-то в столе и уходит. Нужно осмотреть стол." },
                { speaker: "Следователь", text: "Ключ от подсобки и фото. Это уже что-то." , action: () => { evidence.photo = true; evidence.key = true; updateNotebook(); }}
            ],
            bar: [
                { speaker: "Бармен", text: "Следователь? Давно вас не было. Что-нибудь выпьете?" },
                { speaker: "Следователь", text: "Нет времени. Ты знаешь что-нибудь о пропавшей девочке?" },
                { speaker: "Бармен", text: "Может, и знаю. Но информация не бесплатная. Помоги мне с одним делом, и я расскажу." },
                { choices: [
                    { text: "«Сначала информация»", next: 3 },
                    { text: "«Сначала помогу тебе»", next: 4 }
                ]}
            ],
            bar_choice_1: [
                { speaker: "Бармен", text: "Ладно, уговорил. Я видел, как она садилась в машину к тому типу со склада. Он часто заходит сюда." , action: () => { evidence.witness = true; updateNotebook(); } },
                { speaker: "Следователь", text: "Спасибо. Это очень поможет." }
            ],
            bar_choice_2: [
                { speaker: "Бармен", text: "Помоги мне с ящиком. (Вы помогаете). Вот, держи информацию: он работает на складе и его зовут... (называет имя)." , action: () => { evidence.witness = true; updateNotebook(); } }
            ]
        };

        // --- ЛОГИКА ---

        function showScreen(id) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById(id).classList.add('active');
        }

        function startGame() {
            startAmbience();
            showScreen('map-screen');
            updateMapNodes();
        }

        function updateMapNodes() {
            // Можно добавить логику, чтобы подсвечивать, где были
            for (let key in visited) {
                if (visited[key]) {
                    let node = document.getElementById('loc-' + key);
                    if (node) node.style.borderColor = '#555'; // Погасить, если уже были
                }
            }
        }

        function travelTo(loc) {
            playClick();
            currentLocation = loc;
            visited[loc] = true;
            
            showScreen('game-screen');
            document.getElementById('game-bg').style.backgroundImage = `url('${images[loc]}')`;
            
            // Загружаем сценарий
            let script = scenarios[loc];
            if (!script) return; // Если сценария нет
            
            currentDialogue = script;
            dialogueIndex = 0;
            renderDialogue();
        }

        function goToMap() {
            playClick();
            // Если нашли все улики, но не были в офисе для финала
            if (evidence.note && evidence.tire && evidence.witness && evidence.key && evidence.photo) {
                showEnding();
                return;
            }
            showScreen('map-screen');
        }

        function renderDialogue() {
            if (!currentDialogue || dialogueIndex >= currentDialogue.length) {
                // Диалог закончен
                document.getElementById('dialogue-container').style.display = 'none';
                return;
            }

            const node = currentDialogue[dialogueIndex];
            const dialogueBox = document.getElementById('dialogue-container');
            const textEl = document.getElementById('text');
            const speakerEl = document.getElementById('speaker');
            const choicesEl = document.getElementById('choices');
            const nextBtn = document.getElementById('next-btn');

            dialogueBox.style.display = 'block';
            choicesEl.innerHTML = '';

            // Выполняем действие (добавление улики)
            if (node.action) node.action();

            if (node.choices) {
                // Если это выбор
                speakerEl.innerText = "Выберите действие";
                textEl.innerText = "";
                nextBtn.style.display = 'none';
                
                node.choices.forEach((choice, idx) => {
                    let btn = document.createElement('button');
                    btn.className = 'choice';
                    btn.innerText = choice.text;
                    btn.onclick = () => {
                        playClick();
                        // Переход по указателю или ветвлению
                        if (loc === 'warehouse') {
                            if (idx === 0) currentDialogue = scenarios.warehouse_choice_1;
                            else currentDialogue = scenarios.warehouse_choice_2;
                        } else if (loc === 'bar') {
                            if (idx === 0) currentDialogue = scenarios.bar_choice_1;
                            else currentDialogue = scenarios.bar_choice_2;
                        }
                        dialogueIndex = 0;
                        renderDialogue();
                    };
                    choicesEl.appendChild(btn);
                });
            } else {
                // Если это обычный текст
                speakerEl.innerText = node.speaker;
                textEl.innerText = node.text;
                nextBtn.style.display = 'block';
            }
        }

        function nextDialogue() {
            playClick();
            dialogueIndex++;
            renderDialogue();
        }

        function updateNotebook() {
            if (evidence.note) document.getElementById('ev-note').classList.add('found');
            if (evidence.tire) document.getElementById('ev-tire').classList.add('found');
            if (evidence.witness) document.getElementById('ev-witness').classList.add('found');
            if (evidence.key) document.getElementById('ev-key').classList.add('found');
            if (evidence.photo) document.getElementById('ev-photo').classList.add('found');
        }

        function showEnding() {
            showScreen('game-over');
            document.getElementById('ending-title').innerText = "ДЕЛО РАСКРЫТО";
            document.getElementById('ending-text').innerText = "Вы собрали все улики: следы шин, записку, показания свидетеля, ключ и фото подозреваемого. Суд признал его виновным. Девочка спасена. Вы — лучший следователь в городе.";
        }

        // Инициализация предзагрузки
        window.onload = () => {
            Object.values(images).forEach(src => {
                let img = new Image();
                img.src = src;
            });
        };

    </script>
</body>
</html>
